<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>视频观看时长</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        min-width: 320px;
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 14px;
      }
      main {
        padding: 16px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 16px;
      }
      h2 {
        margin: 16px 0 6px;
        font-size: 13px;
        font-weight: 600;
        opacity: 0.7;
      }
      .row {
        display: flex;
        justify-content: space-between;
        padding: 4px 0;
      }
      .row::before {
        content: "";
        width: 8px;
        height: 8px;
        margin-right: 8px;
        border-radius: 50%;
        background: transparent;
        align-self: center;
      }
      .row.timing::before {
        background: #16a34a;
        box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.18);
      }
      .total {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid rgba(128, 128, 128, 0.3);
        font-weight: 600;
      }
      #status {
        margin: 10px 0;
        min-height: 1.2em;
        color: #c62828;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      button {
        flex: 1;
        padding: 8px 12px;
        border: 1px solid rgba(128, 128, 128, 0.5);
        border-radius: 6px;
        background: transparent;
        cursor: pointer;
        font-size: 13px;
      }
      button:hover {
        background: rgba(128, 128, 128, 0.15);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>视频观看时长</h1>
      <section id="today"></section>
      <h2>历史累计</h2>
      <section id="summary"></section>
      <div id="status"></div>
      <div class="actions">
        <button id="sync">立即同步</button>
        <button id="options">设置</button>
      </div>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
